version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: wolin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "wolin_student"
      MYSQL_CHARSET: "utf8mb4"
      MYSQL_COLLATION: "utf8mb4_unicode_ci"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend-bak/Dockerfile
    container_name: wolin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WOLIN_DB_URL: "mysql+pymysql://root:123456@mysql:3306/wolin_student?charset=utf8mb4"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: wolin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      WOLIN_API_URL: "http://backend:8000"
      NODE_ENV: "production"
    ports:
      - "3000:3000"

volumes:
  mysql_data:
